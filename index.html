<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이버 탐구 & 코드 공유 스튜디오 (완전판)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap');

        body {
            margin: 0; padding: 0; background-color: #121212; color: #fff;
            font-family: 'Noto Sans KR', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
        }

        #app-container {
            width: 90%; max-width: 700px; background: #1e1e1e;
            border-radius: 20px; box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
            padding: 25px; border: 2px solid #333; box-sizing: border-box;
        }

        .title { font-family: 'Black Han Sans', sans-serif; font-size: 26px; color: #00ffcc; margin-bottom: 5px; text-align: center; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
        .subtitle { color: #aaa; margin-bottom: 20px; font-size: 13px; text-align: center; }

        .screen { display: none; }
        .active { display: block; }

        .menu-btn {
            display: block; width: 100%; background: #2a2a2a; color: #fff;
            border: 2px solid #444; border-radius: 10px; padding: 15px; margin-bottom: 12px;
            font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: left;
        }
        .menu-btn:hover { background: #00ffcc; color: #000; border-color: #00ffcc; }

        .box { background: #2a2a2a; padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        input[type="text"], input[type="password"], textarea {
            width: 100%; background: #000; color: #00ffcc;
            border: 2px solid #444; border-radius: 8px; padding: 12px;
            font-size: 15px; box-sizing: border-box; margin-bottom: 10px; font-family: inherit;
        }
        input:focus, textarea:focus { outline: none; border-color: #00ffcc; }

        .action-btn {
            width: 100%; background: #ff0055; color: #fff; border: none;
            padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold;
            cursor: pointer; margin-top: 5px;
        }
        .action-btn:active { transform: translateY(2px); }
        .sub-btn { background: #444; margin-top: 10px; }
        .switch-link { text-align: center; margin-top: 15px; font-size: 13px; color: #aaa; cursor: pointer; }
        .switch-link span { color: #00ffcc; font-weight: bold; text-decoration: underline; }

        /* 훈련소 화면 */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .stage-badge { background: #ff0055; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 13px; }
        .npc-box { background: #2a2a2a; padding: 15px; border-radius: 12px; display: flex; align-items: center; margin-bottom: 12px; border-left: 5px solid #00ffcc; }
        .tip-box { background: #111; border: 1px dashed #00ffcc; padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; color: #00ffcc; }

        /* 스튜디오 화면 및 유저 정보 */
        .user-info { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; }
        .admin-badge { background: #ff0055; color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 11px; }
        .board-container { max-height: 180px; overflow-y: auto; margin-top: 15px; }
        .post-card { background: #252525; border-left: 4px solid #00ffcc; padding: 10px; border-radius: 6px; margin-bottom: 8px; position: relative; }
        .post-author { font-weight: bold; color: #00ffcc; font-size: 12px; margin-bottom: 3px; }
        .post-title { font-weight: bold; font-size: 13px; margin-bottom: 5px; color: #fff; }
        .delete-btn { position: absolute; top: 8px; right: 8px; background: #ff4444; color: #fff; border: none; padding: 3px 6px; border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: bold; }
        .run-code-btn { background: #00bfff; color: #000; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; margin-top: 4px; }

        /* 관리자 패널 */
        .admin-panel { background: #221515; border: 1px solid #ff0055; padding: 12px; border-radius: 8px; margin-top: 15px; font-size: 13px; }
        .user-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; background: #111; padding: 6px 10px; border-radius: 5px; }

        /* 모달 (미리보기 및 QR) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1e1e1e; padding: 20px; border-radius: 15px; width: 90%; max-width: 500px; border: 2px solid #00ffcc; box-sizing: border-box; text-align: center; }
        .preview-frame { width: 100%; height: 280px; background: #fff; border-radius: 8px; border: none; margin-top: 10px; }
    </style>
    <!-- QR 코드 생성 라이브러리 연동 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <div id="app-container">
        <div class="title">사이버 탐구 & 코드 공유 스튜디오</div>
        <div class="subtitle">학습, 코드 공유, 비번 변경 및 QR 간편 로그인</div>

        <!-- 메인 메뉴 -->
        <div id="main-menu-screen" class="screen active">
            <button class="menu-btn" onclick="openTraining()">🎮 코딩 공부 훈련소 (HTML 기초 학습)</button>
            <button class="menu-btn" onclick="checkLoginStatus()">🌐 동아리 코드 공유 스튜디오 (로그인 & 게시판)</button>
        </div>

        <!-- 훈련소 화면 -->
        <div id="training-screen" class="screen">
            <div class="header">
                <div class="stage-badge" id="stage-display">STAGE 1</div>
                <div style="color:#00ffcc; font-weight:bold;">HTML</div>
            </div>
            <div class="npc-box">
                <div style="font-size:35px; margin-right:12px;">💡</div>
                <div id="npc-dialogue" style="font-size:14px; line-height:1.4;">미션 설명</div>
            </div>
            <div class="tip-box" id="tip-display">용어 설명</div>
            <textarea id="code-input" placeholder="여기에 코드를 입력하세요!" style="height:90px;"></textarea>
            <button class="action-btn" onclick="checkCode()">▶ 코드 실행하기</button>
            <button class="action-btn sub-btn" onclick="goHome()">🏠 메인 메뉴로</button>
            <div id="feedback" style="margin-top:8px; font-weight:bold; text-align:center; font-size:13px; min-height:18px;"></div>
        </div>

        <!-- 로그인 화면 -->
        <div id="login-screen" class="screen">
            <div class="box">
                <h3 style="margin-top:0; color:#00ffcc; text-align:center;">커뮤니티 로그인</h3>
                <input type="text" id="login-id" placeholder="아이디">
                <input type="password" id="login-pw" placeholder="비밀번호">
                <button class="action-btn" onclick="processLogin()">로그인</button>
                <div class="switch-link" onclick="changeScreen('signup')">계정이 없나요? <span>회원가입하기</span></div>
                <button class="action-btn sub-btn" onclick="goHome()">🏠 메인 메뉴로</button>
            </div>
        </div>

        <!-- 회원가입 화면 -->
        <div id="signup-screen" class="screen">
            <div class="box">
                <h3 style="margin-top:0; color:#00ffcc; text-align:center;">회원가입</h3>
                <p style="font-size:11px; color:#aaa; text-align:center; margin-bottom:10px;">(관리자는 아이디를 <b style="color:#ff0055;">admin</b>으로 만드세요)</p>
                <input type="text" id="signup-id" placeholder="사용할 아이디">
                <input type="password" id="signup-pw" placeholder="사용할 비밀번호">
                <button class="action-btn" onclick="processSignup()">가입 완료하기</button>
                <div class="switch-link" onclick="changeScreen('login')">이미 계정이 있나요? <span>로그인하기</span></div>
                <button class="action-btn sub-btn" onclick="goHome()">🏠 메인 메뉴로</button>
            </div>
        </div>

        <!-- 코드 공유 스튜디오 화면 -->
        <div id="board-screen" class="screen">
            <div class="user-info">
                <div>접속 계정: <b id="display-user" style="color:#00ffcc;"></b> <span id="badge-area"></span></div>
                <div>
                    <button onclick="openChangePwModal()" style="background:none; border:none; color:#00ffcc; cursor:pointer; font-size:11px; margin-right:3px;">비번변경</button>
                    <button onclick="showQrCode()" style="background:none; border:none; color:#00ffcc; cursor:pointer; font-size:11px; margin-right:3px;">QR로그인</button>
                    <button onclick="processLogout()" style="background:none; border:none; color:#aaa; cursor:pointer; font-size:11px;">로그아웃</button>
                </div>
            </div>

            <!-- 비밀번호 변경 구역 (현재 비번 확인 필수) -->
            <div id="pw-change-box" style="display:none; background:#252525; padding:10px; border-radius:8px; margin-bottom:10px;">
                <input type="password" id="current-pw-input" placeholder="현재 비밀번호 입력" style="margin-bottom:5px; font-size:12px; padding:7px;">
                <input type="password" id="new-pw-input" placeholder="새로운 비밀번호 입력" style="margin-bottom:5px; font-size:12px; padding:7px;">
                <button class="action-btn" onclick="updatePassword()" style="padding:6px; font-size:12px;">비밀번호 변경하기</button>
            </div>

            <div style="font-size:13px; font-weight:bold; color:#00ffcc; margin-bottom:4px;">✨ HTML 코드 공유하기</div>
            <input type="text" id="code-title" placeholder="웹페이지 제목" style="margin-bottom:6px; padding:8px; font-size:13px;">
            <textarea id="html-code-input" placeholder="&lt;h1&gt;내 웹페이지&lt;/h1&gt;" style="height:70px; margin-bottom:6px;"></textarea>
            <button class="action-btn" onclick="shareCode()" style="padding:8px; font-size:14px;">인터넷에 코드 올리기</button>

            <div style="margin-top:12px; font-size:13px; font-weight:bold; color:#00ffcc;">🌍 공유된 웹 소스 목록</div>
            <div class="board-container" id="posts-container"></div>

            <!-- 관리자 전용 패널 -->
            <div id="admin-control-panel" class="admin-panel" style="display:none;">
                <div style="font-weight:bold; color:#ff0055; margin-bottom:6px;">⚙️ 관리자 전용: 회원 계정 관리</div>
                <div id="user-list-container"></div>
            </div>
            
            <button class="action-btn sub-btn" onclick="goHome()" style="font-size:12px; padding:5px; margin-top:10px;">🏠 메인 메뉴로 돌아가기</button>
        </div>
    </div>

    <!-- 코드 실행 미리보기 모달 -->
    <div id="preview-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title" style="color:#00ffcc; margin-top:0; font-size:16px;">웹페이지 미리보기</h3>
            <iframe class="preview-frame" id="preview-frame"></iframe>
            <button class="action-btn" onclick="closePreview()" style="margin-top:10px; padding:8px;">닫기</button>
        </div>
    </div>

    <!-- QR 코드 팝업 모달 -->
    <div id="qr-modal" class="modal">
        <div class="modal-content">
            <h3 style="color:#00ffcc; margin-top:0;">📱 간편 로그인 QR</h3>
            <p style="font-size:12px; color:#aaa;">다른 기기 카메라로 스캔하면 바로 로그인됩니다!</p>
            <div id="qrcode-box" style="display:flex; justify-content:center; margin:15px 0; background:#fff; padding:10px; border-radius:8px;"></div>
            <button class="action-btn" onclick="closeQrModal()" style="padding:8px; font-size:14px;">닫기</button>
        </div>
    </div>

    <script>
        // 페이지가 열릴 때 QR 자동 로그인 체크
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const qrUser = urlParams.get('qr');
            if (qrUser) {
                let users = JSON.parse(localStorage.getItem("db_users") || "{}");
                if (users[qrUser]) {
                    localStorage.setItem("active_login_user", qrUser);
                    alert(`QR 코드로 '${qrUser}' 계정 로그인 완료!`);
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }
        };

        function changeScreen(name) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(name + '-screen').classList.add('active');
        }

        function goHome() {
            document.getElementById("pw-change-box").style.display = "none";
            changeScreen('main-menu');
        }

        // 훈련소 로직
        const trainingData = [
            { msg: "가장 큰 제목을 만들어보자!<br><span style='color:#ff0055;'>&lt;h1&gt;</span> 태그를 써서 <span style='color:#ff0055;'>Hello</span>를 적어봐.", req: ["<h1>", "Hello", "</h1>"], tip: "💡 **&lt;h1&gt;이란?** 가장 커다란 제목 글자를 만들 때 쓰는 태그야." },
            { msg: "누를 수 있는 버튼을 만들자!<br><span style='color:#ff0055;'>&lt;button&gt;</span> 태그를 써봐.", req: ["<button>", "</button>"], tip: "💡 **태그란?** 컴퓨터에게 버튼을 만들어달라고 명령하는 상자야." },
            { msg: "글자를 입력받는 빈 칸을 만들어보자.<br><span style='color:#ff0055;'>&lt;input&gt;</span> 태그를 적어봐.", req: ["<input>"], tip: "💡 **&lt;input&gt;이란?** 사용자가 글자를 칠 수 있는 네모 칸을 만들어줘." },
            { msg: "링크를 만들어보자!<br><span style='color:#ff0055;'>&lt;a href=&quot;&quot;&gt;</span> 태그를 써봐.", req: ["<a", "href="], tip: "💡 **href가 뭐야?** 이동할 인터넷 주소를 뜻하는 속성이야!" },
            { msg: "사진을 띄워보자!<br><span style='color:#ff0055;'>&lt;img src=&quot;&quot;&gt;</span> 태그를 적어봐.", req: ["<img", "src="], tip: "💡 **src가 뭐야?** 사진 파일의 위치를 알려주는 속성이야!" }
        ];
        let currentStage = 1;

        function openTraining() {
            changeScreen('training');
            currentStage = 1;
            loadTrainingStage();
        }

        function loadTrainingStage() {
            document.getElementById("stage-display").innerText = "STAGE " + currentStage;
            document.getElementById("code-input").value = "";
            document.getElementById("feedback").innerText = "";
            if (currentStage <= trainingData.length) {
                let info = trainingData[currentStage - 1];
                document.getElementById("npc-dialogue").innerHTML = info.msg;
                document.getElementById("tip-display").innerHTML = info.tip;
            } else {
                document.getElementById("npc-dialogue").innerHTML = "🎉 모든 기초 훈련을 완벽하게 클리어했습니다!";
                document.getElementById("tip-display").innerHTML = "💡 이제 코드 공유 스튜디오를 이용해보세요.";
            }
        }

        function checkCode() {
            if (currentStage > trainingData.length) return;
            let code = document.getElementById("code-input").value;
            let info = trainingData[currentStage - 1];
            let pass = true;
            for (let i = 0; i < info.req.length; i++) {
                if (!code.includes(info.req[i])) { pass = false; break; }
            }
            let fb = document.getElementById("feedback");
            if (pass) {
                fb.style.color = "#00ffcc";
                fb.innerText = "미션 성공! 다음 스테이지로 이동합니다...";
                setTimeout(() => { currentStage++; loadTrainingStage(); }, 2000);
            } else {
                fb.style.color = "#ff0055";
                fb.innerText = "앗, 힌트를 다시 확인하고 코드를 고쳐보세요!";
            }
        }

        // 로그인 및 커뮤니티 로직
        function checkLoginStatus() {
            let savedUser = localStorage.getItem("active_login_user");
            if (savedUser) {
                showBoardScreen(savedUser);
            } else {
                changeScreen('login');
            }
        }

        function processSignup() {
            let id = document.getElementById("signup-id").value.trim();
            let pw = document.getElementById("signup-pw").value.trim();
            if (!id || !pw) { alert("아이디와 비밀번호를 입력해주세요!"); return; }

            let users = JSON.parse(localStorage.getItem("db_users") || "{}");
            if (users[id]) { alert("이미 존재하는 아이디입니다!"); return; }

            users[id] = pw;
            localStorage.setItem("db_users", JSON.stringify(users));
            alert("회원가입 완료! 로그인해 주세요.");
            document.getElementById("signup-id").value = "";
            document.getElementById("signup-pw").value = "";
            changeScreen('login');
        }

        function processLogin() {
            let id = document.getElementById("login-id").value.trim();
            let pw = document.getElementById("login-pw").value.trim();
            let users = JSON.parse(localStorage.getItem("db_users") || "{}");

            if (!users[id] || users[id] !== pw) {
                alert("아이디 또는 비밀번호가 틀렸습니다!");
                return;
            }

            localStorage.setItem("active_login_user", id);
            document.getElementById("login-id").value = "";
            document.getElementById("login-pw").value = "";
            showBoardScreen(id);
        }

        function showBoardScreen(userId) {
            changeScreen('board');
            document.getElementById("display-user").innerText = userId;
            let isAdmin = (userId.toLowerCase() === "admin");
            document.getElementById("badge-area").innerHTML = isAdmin ? 
                "<span class='admin-badge'>관리자</span>" : "<span style='font-size:11px; color:#aaa;'>(일반회원)</span>";
            
            let adminPanel = document.getElementById("admin-control-panel");
            if (isAdmin) {
                adminPanel.style.display = "block";
                renderUserList();
            } else {
                adminPanel.style.display = "none";
            }
            renderSharedCodes();
        }

        function processLogout() {
            localStorage.removeItem("active_login_user");
            document.getElementById("pw-change-box").style.display = "none";
            changeScreen('login');
        }

        // 비밀번호 변경 (현재 비번 확인 필수)
        function openChangePwModal() {
            let box = document.getElementById("pw-change-box");
            box.style.display = box.style.display === "none" ? "block" : "none";
        }

        function updatePassword() {
            let currentPw = document.getElementById("current-pw-input").value.trim();
            let newPw = document.getElementById("new-pw-input").value.trim();

            if (!currentPw || !newPw) { alert("현재 비밀번호와 새 비밀번호를 모두 입력해주세요!"); return; }

            let currentUser = localStorage.getItem("active_login_user");
            let users = JSON.parse(localStorage.getItem("db_users") || "{}");

            if (users[currentUser] !== currentPw) {
                alert("현재 비밀번호가 일치하지 않습니다!");
                return;
            }

            users[currentUser] = newPw;
            localStorage.setItem("db_users", JSON.stringify(users));
            alert("비밀번호가 안전하게 변경되었습니다!");
            document.getElementById("current-pw-input").value = "";
            document.getElementById("new-pw-input").value = "";
            document.getElementById("pw-change-box").style.display = "none";
        }

        // QR 코드 생성 기능
        function showQrCode() {
            let currentUser = localStorage.getItem("active_login_user");
            let box = document.getElementById("qrcode-box");
            box.innerHTML = "";

            let loginUrl = window.location.href.split('?')[0] + "?qr=" + currentUser;

            new QRCode(box, {
                text: loginUrl,
                width: 140,
                height: 140
            });

            document.getElementById("qr-modal").style.display = "flex";
        }

        function closeQrModal() {
            document.getElementById("qr-modal").style.display = "none";
        }

        // 관리자 전용: 회원 삭제
        function renderUserList() {
            let container = document.getElementById("user-list-container");
            let users = JSON.parse(localStorage.getItem("db_users") || "{}");

            let html = "";
            for (let id in users) {
                let canDeleteUser = (id.toLowerCase() !== "admin");
                html += `
                    <div class="user-row">
                        <span>👤 <b>${id}</b></span>
                        ${canDeleteUser ? `<button onclick="adminDeleteUser('${id}')" style="background:#ff4444; color:#fff; border:none; padding:3px 6px; border-radius:4px; cursor:pointer; font-size:11px;">계정 강제삭제</button>` : '<span style="font-size:11px; color:#aaa;">보호됨</span>'}
                    </div>
                `;
            }
            container.innerHTML = html || "<div style='color:#666; font-size:12px;'>가입된 회원이 없습니다.</div>";
        }

        function adminDeleteUser(targetId) {
            if (confirm(`정말로 '${targetId}' 계정을 삭제하시겠습니까?`)) {
                let users = JSON.parse(localStorage.getItem("db_users") || "{}");
                delete users[targetId];
                localStorage.setItem("db_users", JSON.stringify(users));
                
                let posts = JSON.parse(localStorage.getItem("shared_html_codes") || "[]");
                posts = posts.filter(p => p.author !== targetId);
                localStorage.setItem("shared_html_codes", JSON.stringify(posts));

                renderUserList();
                renderSharedCodes();
                alert(`'${targetId}' 계정이 삭제되었습니다.`);
            }
        }

        // HTML 코드 공유 및 미리보기 로직
        function shareCode() {
            let title = document.getElementById("code-title").value.trim();
            let htmlCode = document.getElementById("html-code-input").value.trim();

            if (!title || !htmlCode) {
                alert("웹페이지 제목과 HTML 코드를 모두 입력해주세요!");
                return;
            }

            let currentUser = localStorage.getItem("active_login_user");
            let posts = JSON.parse(localStorage.getItem("shared_html_codes") || "[]");
            
            let newPost = {
                id: Date.now(),
                author: currentUser,
                title: title,
                code: htmlCode
            };

            posts.unshift(newPost);
            localStorage.setItem("shared_html_codes", JSON.stringify(posts));

            document.getElementById("code-title").value = "";
            document.getElementById("html-code-input").value = "";
            alert("성공적으로 공유되었습니다!");
            renderSharedCodes();
        }

        function renderSharedCodes() {
            let container = document.getElementById("posts-container");
            let posts = JSON.parse(localStorage.getItem("shared_html_codes") || "[]");
            let currentUser = localStorage.getItem("active_login_user");
            let isAdmin = (currentUser && currentUser.toLowerCase() === "admin");

            if (posts.length === 0) {
                container.innerHTML = "<div style='text-align:center; color:#666; padding:15px; font-size:12px;'>공유된 웹 코드가 없습니다. 첫 코드를 올려보세요!</div>";
                return;
            }

            let html = "";
            posts.forEach(p => {
                let canDel = isAdmin || (p.author === currentUser);
                let encodedCode = encodeURIComponent(p.code);
                let encodedTitle = encodeURIComponent(p.title);

                html += `
                    <div class="post-card">
                        <div class="post-author">${p.author} ${p.author === 'admin' ? '<span class="admin-badge">ADMIN</span>' : ''}</div>
                        <div class="post-title">${p.title}</div>
                        <button class="run-code-btn" onclick="runPreview('${encodedTitle}', '${encodedCode}')">▶ 웹 실행 화면 보기</button>
                        ${canDel ? `<button class="delete-btn" onclick="deleteSharedCode(${p.id})">삭제</button>` : ''}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function runPreview(encodedTitle, encodedCode) {
            let title = decodeURIComponent(encodedTitle);
            let code = decodeURIComponent(encodedCode);

            document.getElementById("modal-title").innerText = "미리보기: " + title;
            let iframe = document.getElementById("preview-frame");
            document.getElementById("preview-modal").style.display = "flex";

            let doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(code);
            doc.close();
        }

        function closePreview() {
            document.getElementById("preview-modal").style.display = "none";
        }

        function deleteSharedCode(id) {
            let posts = JSON.parse(localStorage.getItem("shared_html_codes") || "[]");
            let currentUser = localStorage.getItem("active_login_user");
            let isAdmin = (currentUser && currentUser.toLowerCase() === "admin");

            posts = posts.filter(p => {
                if (isAdmin) return p.id !== id;
                return p.id !== id || p.author === currentUser;
            });
            localStorage.setItem("shared_html_codes", JSON.stringify(posts));
            renderSharedCodes();
        }
    </script>
</body>
</html>
